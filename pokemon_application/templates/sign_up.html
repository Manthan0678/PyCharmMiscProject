<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Pokedex Terminal</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="master-banner">
        <div class="banner-content">
            <h1 class="title-main">POKÉDEX</h1>
            <img class="banner-avatar" src="https://assets.pokemon.com/assets/cms2/img/pokedex/full/493.png" alt="Arceus">
            <h1 class="title-main">TERMINAL</h1>
        </div>
        <nav>
            <ul class="nav-tabs">
                <li><a href="#" class="nav-link">Sign Up</a></li>
                <li><a href="#" class="nav-link">Log In</a></li>
                <li><a href="#" class="nav-link">Get Data</a></li>
                <li><a href="#" class="nav-link">Type Chart</a></li>
            </ul>
        </nav>
    </header>
    <main class="content-wrapper">
        <div class="display-card">
            <h2>SIGN UP NEW TRAINER</h2>
            <p class="card-subtitle">Establish datalink connection to access the Pokedex terminal.</p>
        {% if error %}
                <div id="error-box" style="color: red; font-weight: bold; text-align: center; margin-bottom: 15px;">
            {{ error }}
            </div>
        {% endif %}
            <form class="signup form" action="/signup" method="POST">
                <div class="form-group">
                    <label for="trainer-id">Trainer ID</label>
                    <input type="text" id="trainer-id" name="trainer_id" placeholder="e.g., RED_001" required >
                </div>

                <div class="form-group">
                    <label for="email-id">Email Id</label>
                    <input type="email" id="email-id" name="email_id" placeholder="e.g., redpokedex@gmail.com" required >
                </div>

                <div class="form-group">
                    <label for="access-key">Access Key</label>
                    <input type="password" name="access_key" id="access_key" placeholder="••••••••" required 
                    pattern="(?=.*\d)(?=.*[A-Z])(?=.*[!@#$%^&*()]).{8,}" 
                    title="Must contain at least 8 characters, including 1 uppercase letter, 1 number, and 1 special character.">
                </div>

                <button type="submit"  class="auth-btn">CREATE ACCOUNT!</button>
            </form>

            <div class="form-footer">
                <p>Already have account? <a href="#" class="footer-link">Log in here</a></p>
            </div>
        </div>
    </main>
<footer class="system-footer">
        <p>> SYSTEM STATUS: <span class="status-online">ONLINE</span> | DATALINK: SECURE | v1.0.0</p>
    </footer>
<script>
        const errorBox = document.getElementById('error-box');
        const inputFields = document.querySelectorAll('input');

        if (errorBox) {
            inputFields.forEach(input => {
                input.addEventListener('input', function() {
                    errorBox.style.display = 'none';
                });
            });
        }
    </script>
</body>
</html>
